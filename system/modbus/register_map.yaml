# Mapa de registros Modbus — SIP Smart Belt Monitor, Cargill APG 27084.
#
# Es la fuente ÚNICA de verdad del mapa: de acá salen la tabla de la UI, la
# documentación para el integrador (`python -m system.modbus.export_map`) y las
# direcciones que el código pide por nombre con `SCHEMA.addr("...")`. Ninguna
# dirección se escribe como literal en otro archivo.
#
# Direccionamiento BASE-1: el registro 1 es el primer holding register, el que el
# PLC lee como 40001. Regla única: **reg N ⇔ 4000N**, sin off-by-one que traducir
# entre el código, la documentación y el integrador.
#
# LAS DIRECCIONES SON LAS DE LA VERSIÓN ANTERIOR DEL EQUIPO y no se mueven: el PLC
# ya está programado contra ellas. Lo que sí cambió al migrar son los `name:`, que
# pasaron al inglés porque son el contrato con `metrics.py` y con el código, no con
# el PLC. Dos cambios de semántica, decididos a propósito y anotados donde van: el
# registro 51 y los tres registros nuevos del final.
#
# Campos de cada entrada (ver `system/modbus/schema.py`):
#   addr      dirección base-1, única
#   name      id corto y único; es el nombre con el que el código lo pide
#   desc      texto humano; va a la UI y a la doc del integrador
#   producer  inference | health | config — quién escribe el registro
#   scale     registro = round(valor * scale). El productor entrega el valor
#             físico y el esquema escala; nadie multiplica por su cuenta.
#   unit      unidad del valor SIN escalar, para la doc
#   is_bool   codifica como 0/1
#
# Este mapa no declara filas `config`: la configuración se edita en el equipo y el
# PLC no escribe nada. El servidor sirve sólo FC03.

# ── Palabras de estado (1-2) ─────────────────────────────────────────────────
- addr: 1
  name: system_status_bitfield
  desc: Estado del sistema (bitfield) — un bit en 1 es una falla
  producer: health

- addr: 2
  name: com_status_bitfield
  desc: Canales de comunicación (bitfield) — un bit en 1 es un canal andando
  producer: health

# ── Resultados de inferencia (3-12) ──────────────────────────────────────────
# Los nombres de las filas `producer: inference` son el contrato con `metrics.py`:
# una métrica se publica si existe una fila que se llame igual. Renombrar una acá
# sin renombrarla allá deja el registro en cero y se avisa una sola vez en el log.
#
# La composición (3 y 4) y la carga (5) tienen DENOMINADORES DISTINTOS a propósito:
# 3 y 4 reparten entre sí lo detectado y suman 1000; 5 es lo detectado sobre el ROI
# de cinta y por eso puede pasar de 1000 cuando la cinta desborda.
- addr: 3
  name: pct_pellet_norm
  desc: Composición — pellet entero, sobre el total detectado
  producer: inference
  unit: '%'
  scale: 10

- addr: 4
  name: pct_desmenuzado_norm
  desc: Composición — desmenuzado, sobre el total detectado
  producer: inference
  unit: '%'
  scale: 10

- addr: 5
  name: pct_carga
  desc: Carga de la cinta respecto del ROI; pasa de 100 % si hay desborde
  producer: inference
  unit: '%'
  scale: 10

# ── Medias móviles de 1 h (6-10) ─────────────────────────────────────────────
# La tendencia, no la medición instantánea. Los dos últimos son los que dicen si se
# puede confiar en las tres medias: sin ellos, una media de tres muestras sobre una
# hora se lee igual que una hora entera bien medida.
- addr: 6
  name: pct_pellet_norm_1h
  desc: Pellet — media de la última hora, sólo con material en la cinta
  producer: health
  unit: '%'
  scale: 10

- addr: 7
  name: pct_desmenuzado_norm_1h
  desc: Desmenuzado — media de la última hora, sólo con material en la cinta
  producer: health
  unit: '%'
  scale: 10

- addr: 8
  name: pct_carga_1h
  desc: Carga — media de la última hora, sobre todas las mediciones
  producer: health
  unit: '%'
  scale: 10

- addr: 9
  name: window_coverage_pct
  desc: Cuánto de la última hora se llegó a medir — valida el registro 8
  producer: health
  unit: '%'

- addr: 10
  name: material_present_pct
  desc: Cuánto de lo medido tenía material — valida los registros 6 y 7
  producer: health
  unit: '%'

# ── Salud del modelo (11-12) ─────────────────────────────────────────────────
- addr: 11
  name: confidence_pct
  desc: Confianza media de las detecciones; 0 sin detecciones, que no es baja confianza
  producer: inference
  unit: '%'

- addr: 12
  name: inference_time_ms
  desc: Duración del último ciclo de inferencia
  producer: inference
  unit: ms

# 13-50 libres. El rango quedó reservado en la versión anterior y sigue libre.

# ── Cámaras (51-80) ──────────────────────────────────────────────────────────
# Bloque de 4 registros por cámara, con paso fijo: `camera_N` arranca en
# 51 + 4*(N-1). Hoy hay una sola cámara; 55-80 quedan para las que se agreguen.
- addr: 51
  name: camera_1_state_bitfield
  desc: Estado de la cámara 1 (bitfield); el bit 6 es lente sucio
  producer: health
  # CAMBIÓ AL MIGRAR: antes era un enum 0-5 y ahora es un bitfield, que es lo que
  # además transporta el bit de lente sucio. Es el único registro del mapa cuya
  # semántica se movió, y la lógica del PLC sobre él se actualiza aparte.

- addr: 52
  name: camera_1_temperature_c
  desc: Temperatura de la cámara 1; 0 cuando no hay lectura
  producer: health
  unit: °C

- addr: 53
  name: camera_1_fps
  desc: Frames por segundo medidos de la cámara 1
  producer: health
  unit: fps

- addr: 54
  name: camera_1_illumination_pct
  desc: Brillo medio del frame de la cámara 1
  producer: inference
  unit: '%'

# ── Salud del equipo (81-90) ─────────────────────────────────────────────────
# Las claves espejan las de `SystemMonitor.get_metrics()`, para que el productor
# no tenga que traducir nombres en el camino. Todas sin escala, en enteros, como
# las venía leyendo el PLC.
- addr: 81
  name: heartbeat
  desc: Heartbeat / watchdog — cambia en cada ciclo mientras la app viva
  producer: health

- addr: 82
  name: gpio_inputs_bitfield
  desc: Entradas digitales (bitfield); bits 8-11 marcan falla de lectura
  producer: health

- addr: 83
  name: gpio_outputs_bitfield
  desc: Salidas digitales (bitfield) — eco de lo comandado, no lectura del hardware
  producer: health

- addr: 84
  name: cpu_usage_pct
  desc: CPU en uso
  producer: health
  unit: '%'

- addr: 85
  name: gpu_usage_pct
  desc: GPU en uso
  producer: health
  unit: '%'

- addr: 86
  name: ram_used_mb
  desc: RAM usada
  producer: health
  unit: MB

- addr: 87
  name: disk_free_gb
  desc: Espacio libre en disco
  producer: health
  unit: GB

- addr: 88
  name: cpu_temp_c
  desc: Temperatura de CPU
  producer: health
  unit: °C

- addr: 89
  name: gpu_temp_c
  desc: Temperatura de GPU
  producer: health
  unit: °C

- addr: 90
  name: power_w
  desc: Consumo estimado
  producer: health
  unit: W

# ── Reloj del equipo (97-98) ─────────────────────────────────────────────────
# NUEVOS: el rango 91-100 estaba libre en el mapa anterior. El PLC puede ignorarlos
# hasta que se los quiera usar.
#
# El reloj del equipo como **segundos desde 1970-01-01 00:00 UTC**, en dos registros.
#
# **Para qué está: el PLC es el único reloj confiable que hay.** El vencimiento de la
# licencia se evalúa contra el reloj del equipo, y quien tiene admin en el equipo puede
# atrasarlo. El equipo no puede detectar eso solo —el estado que guarda vive en un disco
# que ese mismo admin controla—, pero el PLC sí: si esta fecha se aparta de la suya más de
# lo razonable, alguien movió el reloj. Comparar y alarmar es del programa del PLC; el
# equipo publica el dato y no juzga.
#
# **El registro de Modbus es de 16 bits siempre**: un valor de 32 bits viaja en dos, que es
# la práctica corriente y todo PLC sabe leer como DINT. Lo que el protocolo NO define es el
# orden de las dos palabras, y ahí es donde fallan estas integraciones:
#
#     97  palabra ALTA   (bits 31-16)
#     98  palabra BAJA   (bits 15-0)
#
#     epoch = (reg97 * 65536) + reg98
#
# Alta primero, en la dirección más baja. Si el PLC lee un DINT y da un número absurdo,
# está invirtiendo las palabras: casi todos los drivers tienen un `word swap` para eso.
#
# Los dos se leen en un solo FC03 pidiéndolos juntos, y así van del mismo tick. Aun leídos
# por separado el error máximo es de un segundo, y la tolerancia con la que se compara
# esto es de un día — que además se come cualquier diferencia de huso horario, así que no
# hay zona horaria que configurar en ningún lado.
#
# Leído como DINT **con signo** el valor da la vuelta en 2038; como unsigned llega a 2106.
- addr: 97
  name: clock_epoch_s_high
  desc: Reloj del equipo, palabra alta (epoch UTC = alta*65536 + baja)
  producer: health
  unit: s

- addr: 98
  name: clock_epoch_s_low
  desc: Reloj del equipo, palabra baja
  producer: health
  unit: s

# El bit de licencia dice que algo anda mal; esta fila dice cuánto falta para que
# empiece a andar mal, que es lo que permite alarmar con un mes de anticipación en vez
# de enterarse el día que la línea para. Una licencia perpetua publica un centinela alto
# y constante (9999); una vencida, sin licencia o con el reloj movido publica 0.
- addr: 99
  name: license_days_remaining
  desc: Días hasta el vencimiento de la licencia
  producer: health
  unit: días
