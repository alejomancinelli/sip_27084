# Plantilla de configuración. La jerarquía espeja los módulos del repo, no las
# pantallas de la GUI. Cada módulo lee su propia sección.

project:
  client: CLIENT_NAME
  project_id: PROJECT_ID

system:
  app_name: APP_NAME
  device_id: DEVICE_ID
  log_level: INFO               # DEBUG | INFO | WARNING | ERROR
  paths:
    logs: ./data/logs
    dataset: ./data/dataset

ui:
  language: LANGUAGE
  dark_mode: true

system_monitor:
  # Métricas de hardware del equipo. Las fuentes cambian entre plataformas
  # (sysfs e INA3221 en Jetson, psutil y nvidia-smi en Windows); las claves que
  # publica el módulo, no.
  disk_path: .                  # partición que se reporta como espacio libre; relativa a la raíz del repo
  net_interfaces: []            # interfaces a medir, p. ej. [eth0, eth1]; [] = todas menos loopback

video:
  # Publicación del video hacia afuera. Los dos servidores sirven los mismos
  # streams —uno crudo y uno anotado por cámara, con la clave del slot en la ruta y
  # no el `name`— y son independientes: se pueden usar los dos, uno o ninguno.
  # Ninguno codifica un stream que nadie esté mirando.
  http:
    # MJPEG: http://<ip>:<puerto>/camera_1/raw y /camera_1/annotated. Es el stream
    # liviano, el que abre una pestaña del navegador sin instalar nada.
    enabled: true
    port: 8091
    jpeg_quality: 80            # 0–100; menos calidad = menos bytes por frame
    frame_width_px: 960         # ancho al que se reduce antes de codificar; 0 = nativo
    log_connections: true       # una línea de log por cliente que entra o sale del stream
  rtsp:
    # RTSP: rtsp://<ip>:<puerto>/camera_1/raw y /camera_1/annotated. Es el video de
    # resolución completa, para un NVR o un reproductor. Necesita GStreamer con
    # gst-rtsp-server instalado en el equipo: sin eso no levanta nada y lo avisa.
    enabled: false
    port: 8554
    codec: h264_sw              # h264_sw | h264_hw | h265_sw | h265_hw | mjpeg
    fps: 15                     # ritmo del stream; el de la cámara o más bajo
    frame_width_px: 0           # ancho al que se escala antes de codificar; 0 = nativo
    net_interfaces: []          # interfaces por las que se publica; [] = todas
    log_connections: true       # una línea de log cuando un stream se abre y se cierra
    # Los codecs `_hw` usan el encoder de la Jetson (nvv4l2*) y no existen en un
    # x86. Los `_sw` codifican por CPU: son los que andan en cualquier equipo, y los
    # que hacen que convenga bajar `fps` o `frame_width_px` con varias cámaras.

image_collector:
  # Dataset de imágenes en `system.paths.dataset`, una carpeta por fecha y cámara:
  # el frame de cámara en original/, el anotado en annotated/ y la metadata de
  # inferencia en un .json al lado del anotado.
  enabled: false                # se prende y se apaga en caliente
  # on_demand: cada guardado lo pide el llamador con save_now(), que es lo que sirve
  # cuando la inferencia corre cada varios minutos y la luz se enciende solo para la
  # captura. interval: el recolector guarda por su cuenta un frame por cámara cada
  # tanto, para los proyectos que infieren de continuo. Cambiar el modo exige
  # reiniciar el recolector.
  mode: on_demand               # on_demand | interval
  interval_min_s: 60            # solo en modo interval: ventana al azar entre guardados
  interval_max_s: 600           # iguales al mínimo = guardado periódico
  max_images: 10000             # tope por cámara; al llegar se borra el guardado más viejo
  min_free_space_gb: 5          # por debajo de esto se hace lugar y, si no alcanza, no se guarda
  save_original: true
  save_annotated: false
  save_inference_json: true
  dedup:
    # Descarta el frame casi idéntico a uno de los últimos guardados de esa cámara,
    # comparando el hash perceptual de la escena.
    enabled: true
    history_len: 5              # guardados contra los que se compara
    hamming_threshold: 5        # 0–64 bits de diferencia; menos = más estricto

telemetry:
  # Salida de datos hacia afuera del equipo. Cada backend es independiente: se
  # pueden usar los dos, uno o ninguno.
  influxdb:
    # Serie temporal para dashboards e históricos (InfluxDB 2.x).
    # El token NO va acá: se lee de la variable de entorno INFLUXDB_TOKEN.
    enabled: false
    url: http://localhost:8086
    org: ORG_NAME
    bucket: BUCKET_NAME
  mqtt:
    # Un mensaje por measurement, publicado en <topic_base>/<measurement>.
    # La password NO va acá: se lee de la variable de entorno MQTT_PASSWORD.
    enabled: false
    host: ''                    # IP o nombre del broker
    port: 0                     # 0 = 1883, o 8883 si tls está en true
    tls: false
    user: ''                    # vacío = sin autenticación
    topic_base: PROJECT_ID      # prefijo de todos los tópicos del equipo

cameras:
  # Una entrada por cámara física, numeradas camera_1 … camera_N. La clave es el
  # slot: es la identidad con la que la cámara aparece en el resto del sistema.
  camera_1:
    name: CAMERA_NAME           # texto que muestra la UI; se puede cambiar sin romper nada
    enabled: true               # false = conectada pero sin capturar (ver get_status)
    brand: BRAND_NAME           # clave de CAMERA_CATALOG en camera_catalog.py
    model: MODEL_NAME           # uno de los "models" de ese fabricante
    driver: DRIVER_USED         # ver REGISTERED_DRIVERS en camera_factory.py
    address: IP_ADDRESS         # IP o ID de GenTL según el driver
    rotation: null              # null | 90cw | 90ccw | 180
    acquisition:
      fps_limit: 15
      exposure_time_us: 25000
      gain: 1.0
    roi:
      enabled: false
      x_px: 0
      y_px: 0
      width_px: 0
      height_px: 0
    illumination_min: 50        # brillo medio mínimo del ROI 0–100
