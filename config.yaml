# Configuración de SIP Smart Belt Monitor — Cargill APG, proyecto 27084.
# La jerarquía espeja los módulos del repo, no las pantallas de la GUI. Cada módulo lee
# su propia sección.

project:
  client: Cargill APG
  project_id: 27084

system:
  app_name: SIP Smart Belt Monitor
  device_id: jetson-cinta-1
  log_level: INFO               # DEBUG | INFO | WARNING | ERROR
  hard_exit: false
  # Termina el proceso al salir sin desarmar el intérprete. Hace falta sólo cuando el
  # proceso aborta DESPUÉS de haber cerrado bien: un framework de inferencia con hilos
  # nativos y Qt cargados a la vez pueden abortar al descargarse (0xC0000409 en Windows),
  # aunque todos los hilos de la app hayan cerrado limpiamente. El cierre ordenado ya
  # corrió; lo que se saltea es la destrucción de módulos —y con ella los `atexit`—, así
  # que viene apagado y se prende en el equipo donde se vea el aborto.
  paths:
    logs: ./data/logs
    dataset: ./data/dataset

ui:
  # La interfaz. Los textos que ve el operador salen de ui/strings.py, que es la tabla
  # de idiomas; `language` elige la columna. `language` y `dark_mode` son las únicas dos
  # claves que la UI aplica sin reiniciar la app.
  enabled: true                 # false = sin ventana (headless), igual que `main.py --headless`
  language: es                  # es | en | pt
  dark_mode: true

system_monitor:
  # Métricas de hardware del equipo. Las fuentes cambian entre plataformas
  # (sysfs e INA3221 en Jetson, psutil y nvidia-smi en Windows); las claves que
  # publica el módulo, no.
  disk_path: .                  # partición que se reporta como espacio libre; relativa a la raíz del repo
  net_interfaces: [enP1p1s0, enP8p1s0]   # enP1p1s0 = cámaras, enP8p1s0 = PLC

video:
  # Publicación del video hacia afuera. Los dos servidores sirven los mismos
  # streams —uno crudo y uno anotado por cámara, con la clave del slot en la ruta y
  # no el `name`— y son independientes: se pueden usar los dos, uno o ninguno.
  # Ninguno codifica un stream que nadie esté mirando.
  http:
    # MJPEG: http://<ip>:<puerto>/camera_1/raw y /camera_1/annotated. Es el stream
    # liviano, el que abre una pestaña del navegador sin instalar nada.
    enabled: true
    port: 8091
    jpeg_quality: 80            # 0–100; menos calidad = menos bytes por frame
    frame_width_px: 960         # ancho al que se reduce antes de codificar; 0 = nativo
    log_connections: true       # una línea de log por cliente que entra o sale del stream
  rtsp:
    # RTSP: rtsp://<ip>:<puerto>/camera_1/raw y /camera_1/annotated. Es el video de
    # resolución completa, para un NVR o un reproductor. Necesita GStreamer con
    # gst-rtsp-server instalado en el equipo: sin eso no levanta nada y lo avisa.
    enabled: false
    port: 8554
    codec: h264_sw              # h264_sw | h264_hw | h265_sw | h265_hw | mjpeg
    fps: 15                     # ritmo del stream; el de la cámara o más bajo
    frame_width_px: 0           # ancho al que se escala antes de codificar; 0 = nativo
    net_interfaces: []          # interfaces por las que se publica; [] = todas
    log_connections: true       # una línea de log cuando un stream se abre y se cierra
    # Los codecs `_hw` usan el encoder de la Jetson (nvv4l2*): son los que convienen acá.
    # Los `_sw` codifican por CPU y andan en cualquier equipo.
  display:
    # Ajuste de imagen para que la vea una persona (tools/image/enhance.py). Va sólo en el
    # camino de visualización —los dos streams y la UI—: el modelo y el dataset siguen
    # recibiendo el frame crudo, porque el dataset es con lo que se reentrena.
    #
    # Acá estaba el brillo del proyecto anterior, que además entraba a la inferencia. Eso
    # ahora se resuelve en la cámara —exposición y ganancia—, que es donde corresponde: ver
    # la nota de `acquisition` de camera_1.
    gamma: 1.0                  # <1 levanta las sombras, >1 las hunde; 1.0 = sin cambio
    clahe_clip: 0.0             # contraste local 0–8; 0 = apagado, cuesta bastante más que gamma

process:
  # Parámetros de lo que se mide en la cinta. Ningún módulo de la maquinaria lee esta
  # sección: la lee `main.py` y se la pasa al analyzer (system/inference/metrics.py) y a
  # los annotators (system/inference/annotations.py), que así se testean con tres números
  # y sin archivo.
  #
  # `belt_roi_px` alimenta a dos consumidores —se dibuja y se mide contra él— y por eso se
  # lee una sola vez: el operador y el PLC no pueden estar mirando cosas distintas.
  belt_roi_px:
    # Referencia del 100 % de carga, y el rectángulo que se dibuja sobre el anotado.
    # NO es `cameras.camera_1.roi`: si fuera el ROI de cámara, el motor recortaría antes
    # de inferir y `pct_pellet` pasaría a dividirse por la misma área que `pct_carga`,
    # cambiando en silencio todos los porcentajes publicados.
    camera_1: {x_px: 425, y_px: 0, width_px: 1445, height_px: 1515}
  dark_background_threshold:
    # Por cámara y por clase: luma por debajo de la cual un píxel de la máscara de esa
    # clase se descarta. Es el fondo oscuro que el polígono aproximadamente convexo de
    # YOLO mete entre partículas dispersas de la pila, y por eso aplica al desmenuzado y
    # no al pellet, que viene apilado y sin huecos. Una clase que no figura no se refina.
    #
    # El nombre de la clase es dato de configuración y tiene que coincidir con el de
    # `inference.models.segmenter.class_names`.
    #
    # El valor heredado (60) se calibró sobre la imagen con el brillo de software aplicado.
    # Sobre el frame crudo NO significa lo mismo: hay que recalibrarlo con la exposición
    # definitiva, mirando la cinta.
    camera_1: {desmenuzado: 60}
  rolling_window_s: 3600        # ventana de las medias móviles que van a los registros 6-10

inference:
  # Un hilo por pipeline: todas las cámaras de un mismo pipeline lo comparten, así que
  # los pesos se cargan una sola vez y el acceso a la GPU queda serializado.
  #
  # EL ORDEN DE LAS ETAPAS NO ESTÁ ACÁ: el pipeline se programa en
  # system/inference/pipeline.py. Acá va de dónde sale cada modelo y qué cámaras entran a
  # cada pipeline.
  overlay:
    # Dibujado del resultado sobre el frame. Sale una sola vez y el mismo array viaja a
    # la UI, al stream `annotated` y al dataset.
    enabled: true
    draw_boxes: false           # con cientos de instancias las cajas tapan la imagen
    draw_masks: true
    mask_style: fill            # fill | outline | both
    mask_alpha: 0.45            # cuánto tiñe el relleno; con muchas instancias conviene bajarlo
    draw_labels: false          # ídem: el reparto ya lo dice el panel de composición
    draw_roi: true
    crop_to_roi: false          # true = anota sólo el recorte analizado, no el frame entero
    draw_summary: false         # el panel de este proyecto lo dibuja annotations.py
    draw_timestamp: true
    font_scale: 0.6
    thickness: 2
    # Por índice de clase, en el orden de `class_names` del modelo: desmenuzado rojo,
    # pellet verde. Son los mismos colores con los que el operador viene leyendo la cinta.
    class_colors_bgr: [[0, 0, 255], [0, 255, 0]]
  pipelines:
    pipeline_1:
      enabled: true
      feature: core
      cameras: [camera_1]
      interval_s: 0.0           # período mínimo entre frames de una misma cámara; 0 = todos
      # Umbrales del resultado completo, no de cada detección: por debajo, el resultado se
      # emite igual pero marcado como no confiable, y sus números no se publican como
      # medición. El descarte por detección es del modelo (`min_confidence_pct`).
      min_detections: 0         # una cinta vacía es una medición válida: 0 % de todo
      min_result_confidence_pct: 0
      # ── El ciclo de medición ──────────────────────────────────────────────
      # Una medición por frame, como el proyecto anterior: el scheduler queda de
      # pass-through y las otras tres claves no hacen nada.
      frames_per_cycle: 1
      cycle_interval_s: 0.0
      capture_timeout_s: 30
      idle_cameras_between_cycles: false
  models:
    segmenter:
      type: yolo_seg            # ver REGISTERED_MODELS en model_factory.py
      path: ./models/pellet_20260623_fp16.engine
      # El dispositivo no se configura: la implementación usa la GPU si hay CUDA
      # disponible y cae a CPU con un warning si no.
      min_confidence_pct: 20    # bajo a propósito: se cuentan muchas instancias chicas
      max_side_px: 0            # lado mayor al que se reduce antes de inferir; 0 = nativo
      # El índice es el que devuelve el framework. El orden de acá decide qué color y qué
      # nombre de métrica le toca a cada clase: invertirlo invierte todos los porcentajes.
      class_names: [desmenuzado, pellet]
      params: {}

image_collector:
  # Dataset de imágenes en `system.paths.dataset`, una carpeta por fecha y cámara:
  # el frame de cámara en original/, el anotado en annotated/ y la metadata de
  # inferencia en un .json al lado del anotado.
  enabled: false                # se prende y se apaga en caliente
  mode: interval                # on_demand | interval
  interval_min_s: 60            # ventana al azar entre guardados
  interval_max_s: 600
  max_images: 10000             # tope por cámara; al llegar se borra el guardado más viejo
  min_free_space_gb: 5          # por debajo de esto se hace lugar y, si no alcanza, no se guarda
  save_original: true
  save_annotated: false
  save_inference_json: false
  dedup:
    # Descarta el frame casi idéntico a uno de los últimos guardados de esa cámara,
    # comparando el hash perceptual de la escena.
    enabled: false
    history_len: 5
    hamming_threshold: 5        # 0–64 bits de diferencia; menos = más estricto

telemetry:
  # Salida de datos hacia afuera del equipo. Cada backend es independiente.
  #
  # ATENCIÓN: la estructura de las series de este proyecto NO es la del template. El
  # dashboard ya existía cuando se migró, así que se conservaron sus nombres —measurements
  # y campos en castellano— y la divergencia está documentada en docs/influxdb.md. La
  # estructura canónica, que es la que usan los proyectos nuevos, está en
  # docs/influxdb_template.md.
  influxdb:
    # El token NO va acá: se lee de la variable de entorno INFLUXDB_TOKEN.
    enabled: true
    url: http://localhost:8086
    org: Cargill-APG
    bucket: '27084'
    legacy_net_labels:
      # Interfaz del sistema operativo -> etiqueta con la que el dashboard la conoce.
      # Existe sólo por compatibilidad: sin esto los campos de red pasarían a llamarse
      # `net_enP1p1s0_rx_mbps` y los paneles de red quedarían vacíos.
      enP1p1s0: eth0
      enP8p1s0: eth1
  mqtt:
    # La password NO va acá: se lee de la variable de entorno MQTT_PASSWORD.
    enabled: false
    host: ''
    port: 0
    tls: false
    user: ''
    topic_base: '27084'

modbus:
  # Servidor esclavo de sólo lectura: el PLC lee los holding registers con FC03 y
  # la app los escribe desde adentro. Los dos transportes comparten el mismo
  # datastore y son independientes.
  #
  # El mapa de registros NO va acá: vive en system/modbus/register_map.yaml. La copia
  # para el integrador se genera con `python -m system.modbus.export_map`.
  slave_id: 1                   # 1–247; el único unit id al que contesta el equipo
  register_count: 100           # registros expuestos: 1–N, o 40001–4000N para el PLC
  tcp:
    enabled: true
    host: 0.0.0.0               # interfaz por la que escucha; 0.0.0.0 = todas
    port: 502                   # por debajo de 1024 Linux pide privilegios
  rtu:
    # RS-485. Necesita el puerto serie libre: si no levanta, el TCP sigue solo.
    enabled: false
    port: /dev/ttyTHS1
    baudrate: 115200
    parity: N                   # N | E | O
    stop_bits: 1

gpio:
  # Entradas y salidas digitales de la Jetson (system/gpio_control.py), por libgpiod.
  # Los números son líneas del chip, no pines del conector. Sin libgpiod el módulo
  # degrada a no-op y lo dice en su status; nadie pregunta si está disponible.
  enabled: true
  chip: /dev/gpiochip0
  polling_interval_ms: 200      # cada cuánto se releen las entradas
  outputs: {DO1: 51, DO2: 52, DO3: 53, DO4: 50}
  inputs: {DI1: 105, DI2: 144, DI3: 106, DI4: 43}
  initial_outputs: {DO1: 1, DO2: 1, DO3: 1, DO4: 1}

lens_health:
  # Detección de lente sucio (system/camera/lens_health.py). Mide la nitidez del ROI de
  # cada cámara —la varianza del Laplaciano, que el polvo sobre el vidrio hace caer— y
  # prende el bit de lente sucio de la palabra de estado de esa cámara, que es el mismo
  # que lee el PLC. No agrega registros: el bit ya existe en el mapa.
  #
  # LA REFERENCIA DE VIDRIO LIMPIO NO VA ACÁ: es de cada cámara y vive en
  # `cameras.<slot>.lens_health.reference`.
  enabled: true
  interval_s: 10              # cada cuánto se mide cada cámara; medir cuesta milisegundos
  window_s: 28800             # 8 h
  threshold_pct: 50           # nitidez mínima, en % de la referencia calibrada de esa cámara
  analysis_width_px: 960      # ancho al que se reduce el recorte antes de medir
  calibration_samples: 30     # muestras que junta la calibración antes de fijar la referencia
  # `analysis_width_px` cambia la escala de la varianza: tocarlo invalida las referencias
  # ya calibradas y obliga a calibrar de nuevo cada cámara.

cameras:
  camera_1:
    name: Cinta
    enabled: true
    brand: Sentech
    model: STC-MCS312POE        # el que reporta la cámara al conectarse
    driver: st_gige             # ver REGISTERED_DRIVERS en camera_factory.py
    address: 192.168.1.101      # sólo informativo: StApi toma el primer dispositivo que encuentra
    rotation: null              # null | 90cw | 90ccw | 180
    acquisition:
      # La exposición es lo que fija el nivel del frame CRUDO, que es el que ve el modelo.
      # El proyecto anterior dejaba 800 µs y compensaba con un brillo de software que
      # además entraba a la inferencia; acá el ajuste va en la cámara y hay que subirlo
      # hasta que el frame crudo tenga el nivel con el que el modelo viene trabajando.
      fps_limit: 15
      exposure_time_us: 800
      gain: 1.0
    roi:
      # Deshabilitado a propósito: el modelo mira el frame completo, igual que hoy. El
      # rectángulo de la cinta no va acá sino en `process.belt_roi_px` — ver la nota ahí.
      enabled: false
      x_px: 0
      y_px: 0
      width_px: 0
      height_px: 0
    illumination_min: 0         # 0 = sin compuerta, como venía; subirlo descarta frames oscuros
    lens_health:
      reference:
        variance: 50.7        # varianza del Laplaciano con el lente limpio
        luma: 11.73           # nivel de gris medio de esa calibración, 0–255
        dispersion_pct: 4.0   # cuánto se parecían entre sí las muestras; alto = recalibrar
        sample_count: 30
        calibrated_at: '2026-07-31T16:22:55'
        conditions:
          exposure_time_us: 800
          gain: 1.0
          rotation: null
          roi: {x_px: 425, y_px: 0, width_px: 1445, height_px: 1515}
    calibration:
      # Intrínsecos del lente, para corregir la distorsión (tools/image/undistort.py). Con
      # esto declarado, main.py le pasa al motor el preprocessor y la imagen corregida pasa
      # a ser el frame de referencia. Sin calibrar: sin corrección.
      camera_matrix: []         # 3x3; [] = sin corrección
      dist_coeffs: []           # 4, 5, 8, 12 o 14 coeficientes
